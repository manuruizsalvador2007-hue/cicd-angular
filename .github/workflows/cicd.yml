name: Angular CI/CD

# on: cuándo se ejecuta el workflow.
# - pull_request contra main -> solo CI (tests + build), sirve de status check para la PR.
# - push a main (al fusionar una PR) -> CI y después CD (despliegue en GitHub Pages).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Evita dos despliegues a la vez: si llega otro push a main, el anterior no se corta a medias.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

# jobs: trabajos que forman el workflow. Cada job corre en una máquina limpia.
jobs:
  # ---------------- CI ----------------
  build:
    runs-on: ubuntu-latest
    # permissions: permisos mínimos. Para compilar solo hace falta leer el repositorio.
    permissions:
      contents: read
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Extensión: tests en modo no interactivo con cobertura.
      # Los umbrales (80 % sentencias/funciones/líneas, 70 % ramas) están en angular.json;
      # si no se alcanzan o falla un test, este paso devuelve error y el job falla.
      - name: Tests unitarios con cobertura
        run: npm run test:ci

      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      # base-href = /<nombre-del-repo>/ para que funcione en https://<usuario>.github.io/<repo>/
      - name: Compilar Angular
        run: npx ng build --base-href /${{ github.event.repository.name }}/

      # Solo en push: en una PR no se publica nada.
      - name: Subir artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/cicd-angular/browser

  # ---------------- CD ----------------
  deploy:
    # needs: solo empieza cuando build ha terminado bien.
    needs: build
    # if: solo en push a main (nunca en pull requests).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Permisos mínimos para publicar en Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
